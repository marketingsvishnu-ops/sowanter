```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA FITNESS</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #080914;
            color: white;
            overflow-x: hidden;
        }

        html {
            scroll-behavior: smooth;
        }

        /* BACKGROUND GLOW */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #6c4cff;
            filter: blur(180px);
            opacity: .15;
            top: -150px;
            left: -150px;
            z-index: -1;
        }

        /* NAVBAR */

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 999;

            padding: 20px 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(8, 9, 20, .75);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #8d70ff;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: .3s;
        }

        nav a:hover {
            color: white;
        }

        .nav-btn {
            background: linear-gradient(135deg, #7657ff, #a45cff);
            padding: 11px 20px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            padding: 150px 7% 80px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero-text small {
            color: #987cff;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .hero-text h1 {
            font-size: clamp(50px, 7vw, 90px);
            line-height: .95;
            letter-spacing: -5px;
            margin: 25px 0;
        }

        .hero-text h1 span {
            background: linear-gradient(90deg, #8c6cff, #c05cff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero-text p {
            color: #9698a8;
            max-width: 540px;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .primary {
            background: linear-gradient(135deg, #7657ff, #a45cff);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(120,80,255,.25);
        }

        .secondary {
            border: 1px solid #303145;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }

        /* HERO IMAGE */

        .hero-image {
            position: relative;
        }

        .hero-image img {
            width: 100%;
            height: 600px;
            object-fit: cover;
            border-radius: 30px;
            filter: brightness(.75);
        }

        .floating-card {
            position: absolute;
            bottom: 30px;
            left: -30px;

            background: rgba(20,21,35,.9);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;

            padding: 20px 25px;
        }

        .floating-card strong {
            font-size: 28px;
        }

        .floating-card p {
            color: #888;
            font-size: 13px;
        }

        /* SECTION */

        section {
            padding: 110px 7%;
        }

        .section-heading {
            text-align: center;
            max-width: 650px;
            margin: auto;
            margin-bottom: 60px;
        }

        .section-heading small {
            color: #9578ff;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .section-heading h2 {
            font-size: 45px;
            margin: 15px 0;
        }

        .section-heading p {
            color: #858796;
            line-height: 1.7;
        }

        /* SERVICES */

        .services {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .service {
            padding: 35px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 20px;
            transition: .3s;
        }

        .service:hover {
            transform: translateY(-8px);
            border-color: #7657ff;
            background: rgba(118,87,255,.08);
        }

        .service-icon {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                rgba(118,87,255,.2),
                rgba(164,92,255,.1)
            );

            font-size: 25px;
            margin-bottom: 25px;
        }

        .service h3 {
            margin-bottom: 12px;
            font-size: 21px;
        }

        .service p {
            color: #858796;
            line-height: 1.7;
            font-size: 14px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }

        .stat {
            text-align: center;
            padding: 35px 20px;
            background: rgba(255,255,255,.03);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,.06);
        }

        .stat h3 {
            font-size: 40px;
            background: linear-gradient(90deg,#8d70ff,#c05cff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .stat p {
            color: #77798a;
            margin-top: 5px;
        }

        /* PRICING */

        .pricing {
            background: #0c0d19;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .plan {
            padding: 40px 30px;
            border-radius: 25px;
            background: #121321;
            border: 1px solid #25263a;
        }

        .plan.featured {
            border: 1px solid #896aff;
            box-shadow: 0 20px 60px rgba(118,87,255,.15);
            transform: translateY(-10px);
        }

        .badge {
            display: inline-block;
            background: #7657ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .plan h3 {
            font-size: 24px;
        }

        .price {
            font-size: 48px;
            font-weight: 800;
            margin: 20px 0;
        }

        .price span {
            color: #777;
            font-size: 14px;
            font-weight: normal;
        }

        .plan ul {
            list-style: none;
            margin: 25px 0;
        }

        .plan li {
            color: #8c8e9e;
            padding: 10px 0;
            border-bottom: 1px solid #252636;
            font-size: 14px;
        }

        .plan li::before {
            content: "✓";
            color: #9b7cff;
            margin-right: 10px;
        }

        .plan a {
            display: block;
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            background: #222437;
        }

        .plan.featured a {
            background: linear-gradient(135deg,#7657ff,#a45cff);
        }

        /* ABOUT */

        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 70px;
        }

        .about img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 25px;
        }

        .about-content h2 {
            font-size: 48px;
            margin: 15px 0 25px;
        }

        .about-content h2 span {
            color: #9678ff;
        }

        .about-content p {
            color: #858796;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        /* CONTACT */

        .contact-box {
            max-width: 800px;
            margin: auto;
            padding: 40px;
            background: #121321;
            border: 1px solid #25263a;
            border-radius: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;

            background: #0b0c17;
            border: 1px solid #292a3e;
            border-radius: 10px;

            color: white;
            outline: none;
        }

        textarea {
            height: 150px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            border-color: #7657ff;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;

            background: linear-gradient(135deg,#7657ff,#a45cff);
        }

        /* FOOTER */

        footer {
            padding: 40px 7%;
            border-top: 1px solid #1e1f2d;
            display: flex;
            justify-content: space-between;
            color: #666879;
            font-size: 14px;
        }

        footer span {
            color: #9678ff;
        }

        /* MOBILE */

        @media(max-width:900px) {

            nav {
                display: none;
            }

            .hero,
            .about {
                grid-template-columns: 1fr;
            }

            .hero {
                padding-top: 140px;
            }

            .hero-image img {
                height: 450px;
            }

            .services,
            .plans {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .plan.featured {
                transform: none;
            }
        }

        @media(max-width:600px) {

            section {
                padding: 80px 5%;
            }

            .hero {
                padding-left: 5%;
                padding-right: 5%;
            }

            .hero-text h1 {
                font-size: 55px;
            }

            .hero-image img {
                height: 400px;
            }

            .floating-card {
                left: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            .primary,
            .secondary {
                text-align: center;
            }

            footer {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
